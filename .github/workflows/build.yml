name: Build Schedule React Native

on:
  push:
    branches: [main, react-native-migration]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: schedule-native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    name: React Native Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13'
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - name: Install JavaScript dependencies
        run: npm install
      - name: Generate bundled notification sound
        run: node scripts/generate-chime.mjs
      - name: Validate Expo and React Native dependency compatibility
        run: |
          npx expo install --fix
          npx expo-doctor
      - name: Run native domain tests
        run: node --test tests/*.test.js
      - name: Generate native Android project
        run: npx expo prebuild --platform android --clean
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon -PreactNativeArchitectures=arm64-v8a assembleDebug
      - name: Verify React Native APK
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          $ANDROID_HOME/build-tools/36.0.0/aapt dump badging "$APK" | grep -q "package: name='com.schedule.studentplanner'"
          $ANDROID_HOME/build-tools/36.0.0/aapt dump xmltree "$APK" AndroidManifest.xml > /tmp/schedule-native-manifest.txt
          grep -q 'RECEIVE_BOOT_COMPLETED' /tmp/schedule-native-manifest.txt
          test -s assets/schedule_chime.wav
          file assets/schedule_chime.wav
          sha256sum "$APK"
      - name: Upload React Native APK
        uses: actions/upload-artifact@v4
        with:
          name: schedule-react-native-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
