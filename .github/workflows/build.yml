name: Build Schedule

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-build:
    name: Install and build React app
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Run unit tests
        run: npm test
      - name: Report dependency audit
        run: |
          npm audit --json > npm-audit.json || true
          node -e "const a=require('./npm-audit.json'); console.log(JSON.stringify({metadata:a.metadata?.vulnerabilities, packages:Object.entries(a.vulnerabilities||{}).map(([name,v])=>({name,severity:v.severity,isDirect:v.isDirect,range:v.range,fixAvailable:v.fixAvailable}))}, null, 2))"
      - name: Build production bundle
        run: npm run build
      - name: Verify output
        run: test -s dist/index.html
      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: schedule-web-build
          path: dist/
          if-no-files-found: error
      - name: Upload dependency audit report
        uses: actions/upload-artifact@v4
        with:
          name: schedule-dependency-audit
          path: npm-audit.json
          if-no-files-found: error
