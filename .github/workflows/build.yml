name: Build Schedule

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-build:
    name: Install and build React app
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Run unit tests
        run: npm test
      - name: Report dependency audit
        run: |
          npm audit --json > npm-audit.json || true
          node -e "const a=require('./npm-audit.json'); console.log(JSON.stringify({metadata:a.metadata?.vulnerabilities, packages:Object.entries(a.vulnerabilities||{}).map(([name,v])=>({name,severity:v.severity,isDirect:v.isDirect,range:v.range,fixAvailable:v.fixAvailable}))}, null, 2))"
      - name: Build production bundle
        run: npm run build
      - name: Verify output
        run: test -s dist/index.html
      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: schedule-web-build
          path: dist/
          if-no-files-found: error
      - name: Upload dependency audit report
        uses: actions/upload-artifact@v4
        with:
          name: schedule-dependency-audit
          path: npm-audit.json
          if-no-files-found: error

  android-apk:
    name: Build Android debug APK
    runs-on: ubuntu-latest
    needs: web-build
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install dependencies
        run: npm install
      - name: Build web assets
        run: npm run build
      - name: Generate Capacitor Android project
        run: npx cap add android
      - name: Sync native plugins
        run: npx cap sync android
      - name: Add Android reminder permissions
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const file = 'android/app/src/main/AndroidManifest.xml'
          let xml = fs.readFileSync(file, 'utf8')
          const permissions = [
            'android.permission.POST_NOTIFICATIONS',
            'android.permission.SCHEDULE_EXACT_ALARM',
            'android.permission.VIBRATE'
          ]
          for (const permission of permissions) {
            const tag = `<uses-permission android:name="${permission}" />`
            if (!xml.includes(permission)) xml = xml.replace(/<application\b/, `${tag}\n    <application`)
          }
          fs.writeFileSync(file, xml)
          NODE
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
      - name: Verify APK
        run: test -s android/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: schedule-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
